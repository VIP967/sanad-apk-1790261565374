<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آلة حاسبة متقدمة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --calc-bg: #1e293b;
            --display-bg: #020617;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --op-color: #f59e0b;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 850px;
            background-color: var(--calc-bg);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 500px) {
            .calculator {
                height: 90vh;
                border-radius: 30px;
            }
        }

        .display-container {
            background-color: var(--display-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 160px;
            word-break: break-all;
        }

        #history {
            color: var(--text-secondary);
            font-size: 1.1rem;
            min-height: 1.5rem;
            margin-bottom: 5px;
            text-align: right;
            direction: ltr;
        }

        #result {
            color: var(--text-main);
            font-size: 2.5rem;
            font-weight: bold;
            text-align: right;
            direction: ltr;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex-grow: 1;
        }

        button {
            border: none;
            border-radius: 16px;
            background-color: var(--btn-bg);
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
        }

        button:active {
            transform: scale(0.95);
            background-color: var(--btn-hover);
        }

        button.operator {
            color: var(--op-color);
        }

        button.scientific {
            background-color: #1e293b;
            color: var(--accent-color);
            font-size: 1rem;
        }

        button.equals {
            background-color: var(--accent-color);
            color: var(--bg-color);
            grid-column: span 2;
        }

        button.clear {
            color: var(--danger);
        }

        .scientific-row {
            grid-template-columns: repeat(5, 1fr);
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        /* Hide scientific by default on very small screens or make scrollable */
        .scientific-controls {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display-container">
        <div id="history"></div>
        <div id="result">0</div>
    </div>

    <div class="scientific-controls">
        <div class="scientific-row">
            <button class="scientific" onclick="appendFunc('Math.sin(')">sin</button>
            <button class="scientific" onclick="appendFunc('Math.cos(')">cos</button>
            <button class="scientific" onclick="appendFunc('Math.tan(')">tan</button>
            <button class="scientific" onclick="appendFunc('Math.log10(')">log</button>
            <button class="scientific" onclick="appendFunc('Math.exp(')">eˣ</button>
        </div>
        <div class="scientific-row">
            <button class="scientific" onclick="appendValue('Math.PI')">π</button>
            <button class="scientific" onclick="appendValue('Math.E')">e</button>
            <button class="scientific" onclick="appendFunc('Math.sqrt(')">√</button>
            <button class="scientific" onclick="appendValue('**')">xʸ</button>
            <button class="scientific" onclick="appendFunc('Math.abs(')">|x|</button>
        </div>
    </div>

    <div class="grid">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendValue('(')">(</button>
        <button class="operator" onclick="appendValue(')')">)</button>
        <button class="operator" onclick="deleteLast()">⌫</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        <button class="operator" onclick="appendValue('%')">mod</button>

        <button class="equals" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const displayResult = document.getElementById('result');
    const displayHistory = document.getElementById('history');
    let currentInput = '';
    let shouldReset = false;

    function appendValue(val) {
        if (shouldReset && !isOperator(val)) {
            currentInput = val;
            shouldReset = false;
        } else {
            currentInput += val;
            shouldReset = false;
        }
        updateDisplay();
    }

    function appendFunc(func) {
        currentInput += func;
        shouldReset = false;
        updateDisplay();
    }

    function isOperator(val) {
        return ['+', '-', '*', '/', '%', '**'].includes(val);
    }

    function clearDisplay() {
        currentInput = '';
        displayHistory.innerText = '';
        updateDisplay();
    }

    function deleteLast() {
        currentInput = currentInput.toString().slice(0, -1);
        updateDisplay();
    }

    function updateDisplay() {
        let visualInput = currentInput
            .replace(/\*/g, '×')
            .replace(/\//g, '÷')
            .replace(/Math\./g, '')
            .replace(/\*\*/g, '^');
        
        displayResult.innerText = visualInput || '0';
    }

    function calculate() {
        try {
            if (currentInput === '') return;
            
            // Handle auto-closing parentheses
            let openParens = (currentInput.match(/\(/g) || []).length;
            let closeParens = (currentInput.match(/\)/g) || []).length;
            while (openParens > closeParens) {
                currentInput += ')';
                openParens--;
            }

            let result = eval(currentInput);
            
            // Format result
            if (result % 1 !== 0) {
                result = parseFloat(result.toFixed(8));
            }

            displayHistory.innerText = displayResult.innerText + ' =';
            displayResult.innerText = result;
            currentInput = result.toString();
            shouldReset = true;
        } catch (error) {
            displayResult.innerText = "Error";
            setTimeout(clearDisplay, 1500);
        }
    }

    // Add keyboard support
    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') appendValue(e.key);
        if (e.key === '+') appendValue('+');
        if (e.key === '-') appendValue('-');
        if (e.key === '*') appendValue('*');
        if (e.key === '/') appendValue('/');
        if (e.key === 'Enter' || e.key === '=') calculate();
        if (e.key === 'Backspace') deleteLast();
        if (e.key === 'Escape') clearDisplay();
    });
</script>

</body>
</html>
